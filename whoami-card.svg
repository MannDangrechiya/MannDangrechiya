<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070D" />
    </linearGradient>
    <linearGradient id="card-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Menlo', 'Consolas', monospace; font-size: 13.5px; }
    .kw { fill: #C084FC; font-weight: 600; }
    .cls { fill: #38BDF8; font-weight: 600; }
    .str { fill: #34D399; }
    .num { fill: #FBBF24; }
    .cmt { fill: #64748B; font-style: italic; }
    .prop { fill: #F1F5F9; }
    .punct { fill: #94A3B8; }
    .ln { fill: #475569; font-size: 12px; }
  </style>

  <!-- Container -->
  <g filter="url(#shadow)">
