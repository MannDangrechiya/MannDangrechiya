        </text>

        <text x="20" y="168">
          <tspan class="kw">final</tspan> <tspan class="cls">List</tspan><tspan class="punct">&lt;</tspan><tspan class="cls">String</tspan><tspan class="punct">&gt;</tspan> <tspan class="prop">stateMgmt</tspan> = <tspan class="punct">[</tspan><tspan class="str">'Riverpod'</tspan><tspan class="punct">, </tspan><tspan class="str">'Provider'</tspan><tspan class="punct">, </tspan><tspan class="str">'GetX'</tspan><tspan class="punct">];</tspan>
        </text>

        <text x="20" y="192">
          <tspan class="kw">final</tspan> <tspan class="cls">String</tspan> <tspan class="prop">education</tspan> = <tspan class="str">'B.E. Computer Engineering (LDRP-ITR)'</tspan><tspan class="punct">;</tspan>
        </text>

        <text x="20" y="216">
          <tspan class="kw">final</tspan> <tspan class="cls">String</tspan> <tspan class="prop">portfolio</tspan> = <tspan class="str">'devportfolio.manndangrechiya.workers.dev'</tspan><tspan class="punct">;</tspan>
        </text>

        <text x="20" y="240">
          <tspan class="cmt">@override</tspan>
        </text>

        <text x="20" y="264">
          <tspan class="cls">Widget</tspan> <tspan class="prop">build</tspan><tspan class="punct">(</tspan><tspan class="cls">BuildContext</tspan> <tspan class="prop">context</tspan><tspan class="punct">) =&gt; </tspan><tspan class="cls">ProductionReadyApp</tspan><tspan class="punct">();</tspan>
        </text>

        <text x="0" y="288">
