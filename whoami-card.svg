        </text>

        <text x="20" y="96">
          <tspan class="kw">final</tspan> <tspan class="cls">String</tspan> <tspan class="prop">company</tspan> = <tspan class="str">'PrintDeed (Gandhinagar)'</tspan><tspan class="punct">;</tspan>
        </text>

        <text x="20" y="120">
          <tspan class="kw">final</tspan> <tspan class="cls">String</tspan> <tspan class="prop">location</tspan> = <tspan class="str">'Ahmedabad, Gujarat, India 🇮🇳'</tspan><tspan class="punct">;</tspan>
        </text>

        <text x="20" y="144">
