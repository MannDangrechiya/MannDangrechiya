    <circle cx="24" cy="21" r="5.5" fill="#EF4444" />
    <circle cx="42" cy="21" r="5.5" fill="#F59E0B" />
    <circle cx="60" cy="21" r="5.5" fill="#10B981" />
    <text x="85" y="25" class="mono" font-size="12" fill="#94A3B8">lib/src/whoami.dart</text>
    <text x="730" y="25" class="mono" font-size="11" fill="#475569">B.E. Comp Eng | 7.76 CGPA</text>
    <line x1="0" y1="42" x2="850" y2="42" stroke="#1E293B" stroke-width="1" />

    <!-- Code Line Content -->
    <g transform="translate(20, 70)">
