<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="achieve-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>
    <linearGradient id="badge-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="badge-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="badge-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="badge-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>

  <rect width="900" height="200" rx="14" fill="url(#achieve-bg)" stroke="#1E293B" stroke-width="1.2" />

  <text x="30" y="36" class="sans" font-size="15" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">ENGINEERING HIGHLIGHTS &amp; ACCOMPLISHMENTS</text>

  <g transform="translate(30, 55)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="195" height="115" rx="10" fill="url(#badge-grad-1)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
      <text x="20" y="32" class="mono" font-size="22">⚡</text>
      <text x="20" y="60" class="sans" font-size="13" font-weight="700" fill="#F8FAFC">60 FPS Motion</text>
      <text x="20" y="78" class="sans" font-size="11" fill="#94A3B8">Jank-free animations &amp; custom painters</text>
      <text x="20" y="98" class="mono" font-size="9.5" fill="#38BDF8" font-weight="600">PERFORMANCE RATING: A+</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(215, 0)">
      <rect width="195" height="115" rx="10" fill="url(#badge-grad-2)" stroke="#818CF8" stroke-width="1" stroke-opacity="0.4" />
      <text x="20" y="32" class="mono" font-size="22">💎</text>
      <text x="20" y="60" class="sans" font-size="13" font-weight="700" fill="#F8FAFC">Pixel Perfection</text>
      <text x="20" y="78" class="sans" font-size="11" fill="#94A3B8">Figma-to-Flutter high precision UI</text>
      <text x="20" y="98" class="mono" font-size="9.5" fill="#818CF8" font-weight="600">FIDELITY: 100% MATCH</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(430, 0)">
      <rect width="195" height="115" rx="10" fill="url(#badge-grad-3)" stroke="#C084FC" stroke-width="1" stroke-opacity="0.4" />
      <text x="20" y="32" class="mono" font-size="22">🏛️</text>
      <text x="20" y="60" class="sans" font-size="13" font-weight="700" fill="#F8FAFC">Clean Architecture</text>
      <text x="20" y="78" class="sans" font-size="11" fill="#94A3B8">Decoupled state, domain &amp; data layers</text>
      <text x="20" y="98" class="mono" font-size="9.5" fill="#C084FC" font-weight="600">STATE: BLOC &amp; RIVERPOD</text>
    </g>

    <!-- Badge 4 -->
    <g transform="translate(645, 0)">
      <rect width="195" height="115" rx="10" fill="url(#badge-grad-4)" stroke="#34D399" stroke-width="1" stroke-opacity="0.4" />
      <text x="20" y="32" class="mono" font-size="22">🌐</text>
      <text x="20" y="60" class="sans" font-size="13" font-weight="700" fill="#F8FAFC">OSS Contributor</text>
      <text x="20" y="78" class="sans" font-size="11" fill="#94A3B8">Building open source Dart packages</text>
      <text x="20" y="98" class="mono" font-size="9.5" fill="#34D399" font-weight="600">COMMUNITY FIRST</text>
    </g>
