<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="layer-ui" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="layer-bloc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="layer-domain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="layer-data" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .arrow { stroke: #64748B; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
  </style>

  <g filter="url(#card-shadow)">
    <!-- Main Background -->
    <rect width="900" height="280" rx="14" fill="url(#arch-bg)" stroke="#1E293B" stroke-width="1.2" />

    <text x="30" y="38" class="sans" font-size="16" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">FLUTTER CLEAN ARCHITECTURE &amp; MOTION ECOSYSTEM</text>
    <text x="30" y="58" class="sans" font-size="12" fill="#64748B">Decoupled, scalable, testable, and reaction-driven state flow</text>

    <!-- Layer 1: Presentation Layer -->
    <g transform="translate(30, 85)">
      <rect width="180" height="155" rx="10" fill="url(#layer-ui)" stroke="#38BDF8" stroke-width="1" />
      <rect x="0" y="0" width="180" height="28" rx="10" fill="#38BDF8" fill-opacity="0.2" />
      <text x="90" y="19" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#38BDF8">PRESENTATION LAYER</text>
      <text x="20" y="52" class="mono" font-size="11" fill="#E2E8F0">• Widgets &amp; Pages</text>
      <text x="20" y="77" class="mono" font-size="11" fill="#E2E8F0">• Custom Painters</text>
      <text x="20" y="102" class="mono" font-size="11" fill="#E2E8F0">• Implicit/Explicit FX</text>
      <text x="20" y="127" class="mono" font-size="11" fill="#E2E8F0">• Design Tokens</text>
    </g>

    <!-- Connector 1 -->
    <path d="M 210 162 L 240 162" class="arrow" />
    <polygon points="243,162 236,158 236,166" fill="#64748B" />

    <!-- Layer 2: State Management -->
    <g transform="translate(245, 85)">
      <rect width="180" height="155" rx="10" fill="url(#layer-bloc)" stroke="#818CF8" stroke-width="1" />
      <rect x="0" y="0" width="180" height="28" rx="10" fill="#818CF8" fill-opacity="0.2" />
      <text x="90" y="19" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#818CF8">STATE / BLoC LAYER</text>
      <text x="20" y="52" class="mono" font-size="11" fill="#E2E8F0">• BLoC / Cubits</text>
      <text x="20" y="77" class="mono" font-size="11" fill="#E2E8F0">• Riverpod Notifiers</text>
      <text x="20" y="102" class="mono" font-size="11" fill="#E2E8F0">• Event &amp; State Flow</text>
      <text x="20" y="127" class="mono" font-size="11" fill="#E2E8F0">• Reactive Streams</text>
    </g>

    <!-- Connector 2 -->
    <path d="M 425 162 L 455 162" class="arrow" />
    <polygon points="458,162 451,158 451,166" fill="#64748B" />

    <!-- Layer 3: Domain Layer -->
    <g transform="translate(460, 85)">
      <rect width="180" height="155" rx="10" fill="url(#layer-domain)" stroke="#C084FC" stroke-width="1" />
      <rect x="0" y="0" width="180" height="28" rx="10" fill="#C084FC" fill-opacity="0.2" />
      <text x="90" y="19" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#C084FC">DOMAIN LAYER</text>
      <text x="20" y="52" class="mono" font-size="11" fill="#E2E8F0">• Business Entities</text>
      <text x="20" y="77" class="mono" font-size="11" fill="#E2E8F0">• Use Cases / Interactors</text>
      <text x="20" y="102" class="mono" font-size="11" fill="#E2E8F0">• Repository Interfaces</text>
      <text x="20" y="127" class="mono" font-size="11" fill="#E2E8F0">• Failures &amp; Either</text>
    </g>

    <!-- Connector 3 -->
    <path d="M 640 162 L 670 162" class="arrow" />
    <polygon points="673,162 666,158 666,166" fill="#64748B" />

    <!-- Layer 4: Data Layer -->
    <g transform="translate(675, 85)">
      <rect width="195" height="155" rx="10" fill="url(#layer-data)" stroke="#34D399" stroke-width="1" />
      <rect x="0" y="0" width="195" height="28" rx="10" fill="#34D399" fill-opacity="0.2" />
      <text x="97" y="19" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#34D399">DATA LAYER</text>
      <text x="20" y="52" class="mono" font-size="11" fill="#E2E8F0">• Repository Impl</text>
      <text x="20" y="77" class="mono" font-size="11" fill="#E2E8F0">• REST APIs (Dio/Http)</text>
      <text x="20" y="102" class="mono" font-size="11" fill="#E2E8F0">• Firebase Services</text>
      <text x="20" y="127" class="mono" font-size="11" fill="#E2E8F0">• Isar / Hive Local DB</text>
    </g>
  </g>
</svg>
