<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070E" />
      <stop offset="40%" stop-color="#0B0F1C" />
      <stop offset="80%" stop-color="#080B15" />
      <stop offset="100%" stop-color="#04050A" />
    </linearGradient>

    <!-- Glassmorphic Card Fill -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.015" />
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.5" />
    </linearGradient>

    <!-- Neon Name Text Gradient -->
    <linearGradient id="neon-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E0E7FF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Subtitle Text Gradient -->
    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="glow-indigo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#6366F1" flood-opacity="0.5" />
    </filter>
    <filter id="cursor-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.9" />
    </filter>

    <!-- Particle Grid Pattern -->
    <pattern id="grid-pattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35" />
      <circle cx="32" cy="32" r="0.8" fill="#6366F1" fill-opacity="0.4" />
    </pattern>

    <!-- Neon Typing Reveal Clip Path -->
    <clipPath id="typing-clip">
      <rect x="45" y="95" width="0" height="55">
        <animate attributeName="width" from="0" to="520" dur="2.8s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      </rect>
    </clipPath>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="800" height="300" rx="14" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Ambient Glowing Background Orbs (SMIL Animated) -->
  <circle cx="150" cy="70" r="130" fill="#4F46E5" fill-opacity="0.22" filter="url(#glow-indigo)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 20,-10; -15,15; 0,0" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="680" cy="220" r="140" fill="#06B6D4" fill-opacity="0.18" filter="url(#glow-cyan)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -25,15; 15,-10; 0,0" dur="14s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="150" r="90" fill="#A855F7" fill-opacity="0.12" filter="url(#glow-indigo)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 15,15; -15,-15; 0,0" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Cybernetic Grid Layer -->
  <rect width="800" height="300" rx="14" fill="url(#grid-pattern)" />

  <!-- Floating Particle Grid Dots (Pure SMIL Animations) -->
  <g id="particles">
    <circle cx="90" cy="50" r="1.8" fill="#38BDF8" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 12,-18; -8,8; 0,0" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="210" cy="80" r="2.2" fill="#818CF8" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; -15,15; 10,-8; 0,0" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="340" cy="40" r="1.5" fill="#C084FC" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; 18,10; -12,-14; 0,0" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="480" cy="65" r="2.5" fill="#38BDF8" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,-15; 14,10; 0,0" dur="11s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="620" cy="45" r="1.8" fill="#818CF8" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,12; -10,-16; 0,0" dur="8.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="730" cy="75" r="2.0" fill="#34D399" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; -12,18; 8,-10; 0,0" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="130" cy="180" r="1.6" fill="#38BDF8" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-12; -14,8; 0,0" dur="9.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="260" cy="220" r="2.4" fill="#C084FC" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="0,0; -18,-10; 12,14; 0,0" dur="7.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.95;0.3" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="530" cy="240" r="1.7" fill="#818CF8" opacity="0.65">
      <animateTransform attributeName="transform" type="translate" values="0,0; 14,-16; -8,12; 0,0" dur="10.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="670" cy="190" r="2.2" fill="#38BDF8" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; -16,10; 10,-14; 0,0" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="230" r="1.5" fill="#A855F7" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,12; -12,-8; 0,0" dur="6.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Glassmorphic Card Container -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="750" height="260" rx="12" fill="url(#glass-grad)" stroke="url(#glass-border)" stroke-width="1.2" />

    <!-- Terminal Window Top Bar Controls -->
    <circle cx="24" cy="24" r="4.5" fill="#FF5F56" />
    <circle cx="38" cy="24" r="4.5" fill="#FFBD2E" />
    <circle cx="52" cy="24" r="4.5" fill="#27C93F" />
    <text x="72" y="28" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" fill="#64748B" letter-spacing="1">MANN_DANGRECHIYA // MAIN_HERO.DART</text>

    <!-- Top Right Online Status Indicator -->
    <g transform="translate(545, 12)">
      <rect x="0" y="0" width="190" height="24" rx="12" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="12" r="3.5" fill="#10B981">
        <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="14" cy="12" r="6.5" fill="#10B981" fill-opacity="0.25">
        <animate attributeName="r" values="5;8.5;5" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="15.5" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#34D399" font-weight="600">AVAILABLE FOR HIRE</text>
    </g>

    <!-- Neon Typing Name Text Overlay -->
    <g transform="translate(24, 70)">
      <!-- Typing Text with ClipPath -->
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="url(#neon-text-grad)" letter-spacing="-0.5" clip-path="url(#typing-clip)" filter="url(#neon-glow)">Mann Dangrechiya</text>
      
      <!-- Neon Cursor line moving along with text reveal -->
      <rect x="0" y="8" width="3.5" height="42" fill="#38BDF8" filter="url(#cursor-glow)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="440 0" dur="2.8s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
        <animate attributeName="opacity" values="1;0;1" dur="0.75s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Subtitle Role with SMIL Fade-In -->
    <text x="24" y="148" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14.5" font-weight="700" fill="url(#sub-grad)" letter-spacing="2" opacity="0">
      FLUTTER DEVELOPER &amp; MOBILE ENGINEER
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.8s" fill="freeze" />
    </text>

    <!-- Tagline description with SMIL Fade-In -->
    <text x="24" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8" opacity="0">
      Architecting high-performance 60 FPS iOS &amp; Android apps with Flutter, Dart &amp; Clean Architecture.
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2.2s" fill="freeze" />
    </text>

    <!-- Status Pills (Flutter Developer, Mobile Engineer, Open Source) -->
    <g transform="translate(24, 198)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2.5s" fill="freeze" />

      <!-- Pill 1: Flutter Developer -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="155" height="30" rx="15" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8" />
        <circle cx="16" cy="15" r="4" fill="#38BDF8">
          <animate attributeName="r" values="3.5;5;3.5" dur="2.5s" repeatCount="indefinite" />
        </circle>
        <text x="28" y="19.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8">Flutter Developer</text>
      </g>

      <!-- Pill 2: Mobile Engineer -->
      <g transform="translate(167, 0)">
        <rect x="0" y="0" width="155" height="30" rx="15" fill="#4F46E5" fill-opacity="0.15" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.8" />
        <circle cx="16" cy="15" r="4" fill="#818CF8">
          <animate attributeName="r" values="3.5;5;3.5" dur="3s" repeatCount="indefinite" />
        </circle>
        <text x="28" y="19.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#818CF8">Mobile Engineer</text>
      </g>

      <!-- Pill 3: Open Source -->
      <g transform="translate(334, 0)">
        <rect x="0" y="0" width="135" height="30" rx="15" fill="#059669" fill-opacity="0.15" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.8" />
        <circle cx="16" cy="15" r="4" fill="#34D399">
          <animate attributeName="r" values="3.5;5;3.5" dur="2.2s" repeatCount="indefinite" />
        </circle>
        <text x="28" y="19.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34D399">Open Source</text>
      </g>
    </g>

  </g>
</svg>
