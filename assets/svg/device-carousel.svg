<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="carousel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060814" />
      <stop offset="40%" stop-color="#0E1326" />
      <stop offset="80%" stop-color="#0A0E1C" />
      <stop offset="100%" stop-color="#04050B" />
    </linearGradient>

    <!-- Phone Frame Metallic Border Gradient -->
    <linearGradient id="phone-frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Phone Glass Border Accent -->
    <linearGradient id="phone-glow-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="phone-glow-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="phone-glow-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Screen App Gradients -->
    <linearGradient id="app-salon-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="app-pos-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="app-runner-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Shadow Filters -->
    <filter id="phone-shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.25" />
    </filter>

    <!-- Clip Paths for Phone Screens -->
    <clipPath id="screen-clip-1">
      <rect x="0" y="0" width="180" height="310" rx="24" />
    </clipPath>
    <clipPath id="screen-clip-2">
      <rect x="0" y="0" width="180" height="310" rx="24" />
    </clipPath>
    <clipPath id="screen-clip-3">
      <rect x="0" y="0" width="180" height="310" rx="24" />
    </clipPath>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="420" rx="14" fill="url(#carousel-bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Carousel Header & Title -->
  <g transform="translate(30, 24)">
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#F8FAFC" letter-spacing="1">FEATURED FLUTTER APPS // INTERACTIVE DEVICE CAROUSEL</text>
    <text x="0" y="34" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">Cross-Platform iOS &amp; Android Production Applications (Auto-sliding SMIL Carousel)</text>
  </g>

  <!-- Carousel Viewport Window (Clipped for smooth infinite sliding effect) -->
  <g transform="translate(0, 60)">
    
    <!-- SMIL Auto-Sliding Track -->
    <g id="carousel-track">
      <animateTransform 
        attributeName="transform" 
        type="translate" 
        values="0,0; -280,0; -560,0; -280,0; 0,0" 
        keyTimes="0; 0.28; 0.56; 0.84; 1" 
        dur="14s" 
        repeatCount="indefinite" 
        calcMode="spline" 
        keySplines="0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95" />

      <!-- ========================================== -->
      <!-- PHONE 1: SALON BOOKING APP -->
      <!-- ========================================== -->
      <g transform="translate(50, 0)" filter="url(#phone-shadow)">
        <!-- Phone Outer Frame -->
        <rect x="0" y="0" width="196" height="326" rx="30" fill="url(#phone-frame-grad)" stroke="url(#phone-glow-1)" stroke-width="1.8" />
        
        <!-- Screen Canvas Container -->
        <g transform="translate(8, 8)" clip-path="url(#screen-clip-1)">
          <!-- Screen Background -->
          <rect x="0" y="0" width="180" height="310" fill="url(#app-salon-grad)" />
          
          <!-- External Image Placeholder URL -->
          <image href="https://images.unsplash.com/photo-1560066984-138dadb4c035?w=400&amp;auto=format&amp;fit=crop&amp;q=80" x="0" y="0" width="180" height="310" preserveAspectRatio="xMidYMid slice" opacity="0.3" />

          <!-- App Mockup Vector UI Layer -->
          <!-- Top Status Bar -->
          <text x="14" y="16" font-family="-apple-system, sans-serif" font-size="9" fill="#FFFFFF" font-weight="600">9:41</text>
          <path d="M 155 10 L 165 10 L 165 16 L 155 16 z" fill="none" stroke="#FFFFFF" stroke-width="0.8" />
          <rect x="156.5" y="11.5" width="6" height="3" fill="#FFFFFF" />

          <!-- Dynamic Island / Notch -->
          <rect x="58" y="6" width="64" height="12" rx="6" fill="#000000" />

          <!-- App Header -->
          <text x="14" y="44" font-family="-apple-system, sans-serif" font-size="13" fill="#FFFFFF" font-weight="800">Glamour Salon</text>
          <text x="14" y="56" font-family="-apple-system, sans-serif" font-size="8.5" fill="#A5B4FC">Book Appointments &amp; Services</text>

          <!-- Banner Card -->
          <rect x="14" y="66" width="152" height="60" rx="10" fill="#6366F1" fill-opacity="0.4" stroke="#818CF8" stroke-width="0.8" />
          <text x="24" y="86" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Special Hair Spa</text>
          <text x="24" y="98" font-family="sans-serif" font-size="8" fill="#C7D2FE">30% OFF this weekend</text>
          <rect x="24" y="104" width="55" height="14" rx="7" fill="#38BDF8" />
          <text x="32" y="114" font-family="sans-serif" font-size="7.5" fill="#0F172A" font-weight="800">BOOK NOW</text>

          <!-- Service Cards List -->
          <rect x="14" y="134" width="152" height="36" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="0.6" />
          <circle cx="32" cy="152" r="10" fill="#818CF8" fill-opacity="0.3" />
          <text x="29" y="155" font-family="sans-serif" font-size="9" fill="#818CF8">✂️</text>
          <text x="48" y="148" font-family="sans-serif" font-size="8.5" fill="#F8FAFC" font-weight="600">Hair Styling</text>
          <text x="48" y="158" font-family="sans-serif" font-size="7.5" fill="#94A3B8">45 mins • $45</text>
          <rect x="134" y="144" width="24" height="16" rx="4" fill="#6366F1" />
          <text x="141" y="155" font-family="sans-serif" font-size="8" fill="#FFFFFF" font-weight="700">+</text>

          <rect x="14" y="176" width="152" height="36" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="0.6" />
          <circle cx="32" cy="194" r="10" fill="#38BDF8" fill-opacity="0.3" />
          <text x="29" y="197" font-family="sans-serif" font-size="9" fill="#38BDF8">💅</text>
          <text x="48" y="190" font-family="sans-serif" font-size="8.5" fill="#F8FAFC" font-weight="600">Manicure Care</text>
          <text x="48" y="200" font-family="sans-serif" font-size="7.5" fill="#94A3B8">30 mins • $30</text>
          <rect x="134" y="186" width="24" height="16" rx="4" fill="#6366F1" />
          <text x="141" y="197" font-family="sans-serif" font-size="8" fill="#FFFFFF" font-weight="700">+</text>

          <!-- Bottom Navigation Bar -->
          <rect x="0" y="270" width="180" height="40" fill="#090D16" fill-opacity="0.95" />
          <circle cx="35" cy="285" r="4" fill="#38BDF8" />
          <circle cx="90" cy="285" r="4" fill="#64748B" />
          <circle cx="145" cy="285" r="4" fill="#64748B" />
          <rect x="65" y="302" width="50" height="3" rx="1.5" fill="#FFFFFF" opacity="0.6" />
        </g>

        <!-- App Name & Badges Below Phone -->
        <g transform="translate(0, 336)">
          <text x="98" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38BDF8">💇 Salon Booking</text>
          <text x="98" y="14" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">Flutter • Firebase • GetX</text>
        </g>
      </g>

      <!-- ========================================== -->
      <!-- PHONE 2: FRUIT POS SYSTEM -->
      <!-- ========================================== -->
      <g transform="translate(330, 0)" filter="url(#phone-shadow)">
        <!-- Phone Outer Frame -->
        <rect x="0" y="0" width="196" height="326" rx="30" fill="url(#phone-frame-grad)" stroke="url(#phone-glow-2)" stroke-width="1.8" />
        
        <!-- Screen Canvas Container -->
        <g transform="translate(8, 8)" clip-path="url(#screen-clip-2)">
          <!-- Screen Background -->
          <rect x="0" y="0" width="180" height="310" fill="url(#app-pos-grad)" />
          
          <!-- External Image Placeholder URL -->
          <image href="https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=400&amp;auto=format&amp;fit=crop&amp;q=80" x="0" y="0" width="180" height="310" preserveAspectRatio="xMidYMid slice" opacity="0.3" />

          <!-- App Mockup Vector UI Layer -->
          <!-- Top Status Bar -->
          <text x="14" y="16" font-family="-apple-system, sans-serif" font-size="9" fill="#FFFFFF" font-weight="600">10:15</text>
          <path d="M 155 10 L 165 10 L 165 16 L 155 16 z" fill="none" stroke="#FFFFFF" stroke-width="0.8" />
          <rect x="156.5" y="11.5" width="6" height="3" fill="#FFFFFF" />

          <!-- Dynamic Island / Notch -->
          <rect x="58" y="6" width="64" height="12" rx="6" fill="#000000" />

          <!-- App Header -->
          <text x="14" y="44" font-family="-apple-system, sans-serif" font-size="13" fill="#FFFFFF" font-weight="800">FreshPOS Terminal</text>
          <text x="14" y="56" font-family="-apple-system, sans-serif" font-size="8.5" fill="#A7F3D0">Inventory &amp; Billing System</text>

          <!-- Sales Summary Card -->
          <rect x="14" y="66" width="152" height="52" rx="10" fill="#047857" fill-opacity="0.5" stroke="#34D399" stroke-width="0.8" />
          <text x="24" y="84" font-family="sans-serif" font-size="8.5" fill="#A7F3D0">TODAY'S SALES</text>
          <text x="24" y="102" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#FFFFFF">$1,248.50</text>
          <text x="110" y="102" font-family="sans-serif" font-size="8" fill="#34D399" font-weight="700">▲ +14%</text>

          <!-- Grid of Fruits -->
          <g transform="translate(14, 126)">
            <!-- Item 1 -->
            <rect x="0" y="0" width="70" height="60" rx="8" fill="#065F46" stroke="#10B981" stroke-width="0.6" />
            <text x="27" y="24" font-family="sans-serif" font-size="14">🍎</text>
            <text x="10" y="40" font-family="sans-serif" font-size="8" fill="#FFFFFF" font-weight="600">Fresh Apple</text>
            <text x="10" y="50" font-family="sans-serif" font-size="7.5" fill="#A7F3D0">$2.99 / kg</text>

            <!-- Item 2 -->
            <rect x="82" y="0" width="70" height="60" rx="8" fill="#065F46" stroke="#10B981" stroke-width="0.6" />
            <text x="109" y="24" font-family="sans-serif" font-size="14">🍊</text>
            <text x="92" y="40" font-family="sans-serif" font-size="8" fill="#FFFFFF" font-weight="600">Orange</text>
            <text x="92" y="50" font-family="sans-serif" font-size="7.5" fill="#A7F3D0">$1.80 / kg</text>

            <!-- Item 3 -->
            <rect x="0" y="68" width="70" height="60" rx="8" fill="#065F46" stroke="#10B981" stroke-width="0.6" />
            <text x="27" y="92" font-family="sans-serif" font-size="14">🍇</text>
            <text x="10" y="108" font-family="sans-serif" font-size="8" fill="#FFFFFF" font-weight="600">Grapes</text>
            <text x="10" y="118" font-family="sans-serif" font-size="7.5" fill="#A7F3D0">$3.50 / kg</text>

            <!-- Item 4 -->
            <rect x="82" y="68" width="70" height="60" rx="8" fill="#065F46" stroke="#10B981" stroke-width="0.6" />
            <text x="109" y="92" font-family="sans-serif" font-size="14">🍌</text>
            <text x="92" y="108" font-family="sans-serif" font-size="8" fill="#FFFFFF" font-weight="600">Banana</text>
            <text x="92" y="118" font-family="sans-serif" font-size="7.5" fill="#A7F3D0">$1.20 / kg</text>
          </g>

          <!-- Bottom Checkout Button -->
          <rect x="14" y="265" width="152" height="30" rx="15" fill="#10B981" />
          <text x="54" y="284" font-family="sans-serif" font-size="10" fill="#042F2E" font-weight="800">CHECKOUT (3)</text>
        </g>

        <!-- App Name & Badges Below Phone -->
        <g transform="translate(0, 336)">
          <text x="98" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#34D399">🍎 Fruit POS System</text>
          <text x="98" y="14" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">Flutter • Realtime DB • Riverpod</text>
        </g>
      </g>

      <!-- ========================================== -->
      <!-- PHONE 3: 3D CYBER RUNNER GAME -->
      <!-- ========================================== -->
      <g transform="translate(610, 0)" filter="url(#phone-shadow)">
        <!-- Phone Outer Frame -->
        <rect x="0" y="0" width="196" height="326" rx="30" fill="url(#phone-frame-grad)" stroke="url(#phone-glow-3)" stroke-width="1.8" />
        
        <!-- Screen Canvas Container -->
        <g transform="translate(8, 8)" clip-path="url(#screen-clip-3)">
          <!-- Screen Background -->
          <rect x="0" y="0" width="180" height="310" fill="url(#app-runner-grad)" />
          
          <!-- External Image Placeholder URL -->
          <image href="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400&amp;auto=format&amp;fit=crop&amp;q=80" x="0" y="0" width="180" height="310" preserveAspectRatio="xMidYMid slice" opacity="0.35" />

          <!-- App Mockup Vector UI Layer -->
          <!-- Top Status Bar -->
          <text x="14" y="16" font-family="-apple-system, sans-serif" font-size="9" fill="#FFFFFF" font-weight="600">11:59</text>
          <path d="M 155 10 L 165 10 L 165 16 L 155 16 z" fill="none" stroke="#FFFFFF" stroke-width="0.8" />
          <rect x="156.5" y="11.5" width="6" height="3" fill="#FFFFFF" />

          <!-- Dynamic Island / Notch -->
          <rect x="58" y="6" width="64" height="12" rx="6" fill="#000000" />

          <!-- Game HUD Top Bar -->
          <rect x="14" y="32" width="152" height="28" rx="6" fill="#000000" fill-opacity="0.6" stroke="#A855F7" stroke-width="0.8" />
          <text x="22" y="50" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F43F5E" font-weight="800">SCORE: 84,290</text>
          <text x="126" y="50" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FBBF24" font-weight="800">⚡ 3x</text>

          <!-- 3D Perspective Road / Grid Lines -->
          <polygon points="20,270 160,270 115,100 65,100" fill="#1E1B4B" stroke="#EC4899" stroke-width="1.2" />
          <line x1="90" y1="100" x2="90" y2="270" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="8 6" />

          <!-- Player Avatar / Cyber Runner -->
          <g transform="translate(80, 200)">
            <circle cx="10" cy="10" r="10" fill="#06B6D4" />
            <polygon points="10,0 18,24 2,24" fill="#F43F5E" />
            <circle cx="10" cy="10" r="16" fill="#F43F5E" fill-opacity="0.3" />
          </g>

          <!-- Obstacles -->
          <rect x="68" y="120" width="16" height="12" fill="#FBBF24" rx="2" stroke="#F59E0B" stroke-width="0.8" />

          <!-- Controls Overlay -->
          <g transform="translate(14, 260)">
            <circle cx="20" cy="20" r="14" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="0.8" />
            <text x="16" y="24" font-family="sans-serif" font-size="11" fill="#FFFFFF">◀</text>
            <circle cx="132" cy="20" r="14" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="0.8" />
            <text x="128" y="24" font-family="sans-serif" font-size="11" fill="#FFFFFF">▶</text>
          </g>
        </g>

        <!-- App Name & Badges Below Phone -->
        <g transform="translate(0, 336)">
          <text x="98" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#F43F5E">🎮 3D Cyber Runner</text>
          <text x="98" y="14" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">Flutter Flame Engine • Rive 3D</text>
        </g>
      </g>

    </g>
  </g>
</svg>
