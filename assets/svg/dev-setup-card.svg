<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ds-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#05070E" />
    </linearGradient>

    <linearGradient id="ds-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.5" />
    </linearGradient>

    <!-- Icon Glow Filters -->
    <filter id="glow-vscode" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-android" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-xcode" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-docker" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-figma" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .dev-tool { transition: all 0.3s ease; cursor: pointer; }
      .dev-tool:hover { transform: translateY(-5px); }
      .dev-tool:hover .tool-icon { filter: brightness(1.25); }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="816" height="216" rx="16" fill="url(#ds-bg)" stroke="url(#ds-border)" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(30, 36)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">
      🛠️ MY DAILY ENGINEERING WORKSPACE &amp; DEV SETUP
    </text>
    <text x="760" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="end">
      WAKATIME TRACKED METRICS
    </text>
  </g>

  <!-- ========================================== -->
  <!-- 5 DEV SETUP TOOL COLUMNS -->
  <!-- ========================================== -->

  <!-- TOOL 1: VS CODE (x: 40) -->
  <g transform="translate(40, 65)" class="dev-tool">
    <rect x="0" y="0" width="135" height="125" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <!-- VS Code Icon -->
    <g transform="translate(47, 18)" class="tool-icon" filter="url(#glow-vscode)">
      <path d="M28.5 0.5 L12 16 L2.5 8.5 L0 10 L8.5 18.5 L0 27 L2.5 28.5 L12 21 L28.5 36.5 L36 32.5 L36 4 L28.5 0.5 Z" fill="#38BDF8" />
    </g>
    <text x="67" y="78" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">VS Code</text>
    <text x="67" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" font-weight="700" text-anchor="middle">64.5% Usage</text>
    <text x="67" y="109" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="middle">Primary IDE</text>
  </g>

  <!-- TOOL 2: ANDROID STUDIO (x: 190) -->
  <g transform="translate(190, 65)" class="dev-tool">
    <rect x="0" y="0" width="135" height="125" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <!-- Android Studio Icon -->
    <g transform="translate(47, 18)" class="tool-icon" filter="url(#glow-android)">
      <path d="M7 14 C7 7, 29 7, 29 14 Z" fill="#34D399" />
      <circle cx="12" cy="11" r="1.5" fill="#0F172A" />
      <circle cx="24" cy="11" r="1.5" fill="#0F172A" />
      <rect x="5" y="16" width="26" height="16" rx="4" fill="#34D399" />
      <line x1="6" y1="5" x2="10" y2="10" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
      <line x1="30" y1="5" x2="26" y2="10" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
    </g>
    <text x="67" y="78" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">Android Studio</text>
    <text x="67" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399" font-weight="700" text-anchor="middle">18.2% Usage</text>
    <text x="67" y="109" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="middle">Android &amp; Gradle</text>
  </g>

  <!-- TOOL 3: XCODE (x: 340) -->
  <g transform="translate(340, 65)" class="dev-tool">
    <rect x="0" y="0" width="135" height="125" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <!-- Xcode Icon -->
    <g transform="translate(47, 18)" class="tool-icon" filter="url(#glow-xcode)">
      <circle cx="18" cy="18" r="16" fill="#0284C7" />
      <path d="M10 26 L22 10 L26 14 L14 30 Z" fill="#F8FAFC" />
      <path d="M14 10 L26 26" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    </g>
    <text x="67" y="78" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">Xcode</text>
    <text x="67" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#06B6D4" font-weight="700" text-anchor="middle">10.3% Usage</text>
    <text x="67" y="109" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="middle">iOS Native &amp; Swift</text>
  </g>

  <!-- TOOL 4: DOCKER (x: 490) -->
  <g transform="translate(490, 65)" class="dev-tool">
    <rect x="0" y="0" width="135" height="125" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <!-- Docker Icon -->
    <g transform="translate(47, 22)" class="tool-icon" filter="url(#glow-docker)">
      <rect x="4" y="12" width="6" height="5" fill="#38BDF8" rx="1" />
      <rect x="12" y="12" width="6" height="5" fill="#38BDF8" rx="1" />
      <rect x="20" y="12" width="6" height="5" fill="#38BDF8" rx="1" />
      <rect x="12" y="5" width="6" height="5" fill="#38BDF8" rx="1" />
      <path d="M0 20 C 6 18, 14 28, 36 20 C 34 26, 26 30, 16 30 C 6 30, 0 25, 0 20 Z" fill="#38BDF8" />
    </g>
    <text x="67" y="78" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">Docker</text>
    <text x="67" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#818CF8" font-weight="700" text-anchor="middle">7.0% Usage</text>
    <text x="67" y="109" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="middle">Containers</text>
  </g>

  <!-- TOOL 5: FIGMA (x: 640) -->
  <g transform="translate(640, 65)" class="dev-tool">
    <rect x="0" y="0" width="135" height="125" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <!-- Figma Icon -->
    <g transform="translate(52, 18)" class="tool-icon" filter="url(#glow-figma)">
      <circle cx="8" cy="8" r="6" fill="#F24E1E" />
      <circle cx="20" cy="8" r="6" fill="#FF7262" />
      <circle cx="8" cy="18" r="6" fill="#A259FF" />
      <circle cx="20" cy="18" r="6" fill="#1ABCFE" />
      <circle cx="8" cy="28" r="6" fill="#0ACF83" />
    </g>
    <text x="67" y="78" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">Figma</text>
    <text x="67" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F472B6" font-weight="700" text-anchor="middle">Design to Code</text>
    <text x="67" y="109" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="middle">UI/UX Layouts</text>
  </g>

</svg>
