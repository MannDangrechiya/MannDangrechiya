<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0D1224" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.5" />
    </linearGradient>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Box -->
  <rect width="760" height="280" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Header -->
  <g transform="translate(30, 24)">
    <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#F8FAFC" letter-spacing="1">LIVE PORTFOLIO &amp; CODING METRICS</text>
    <text x="0" y="34" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94A3B8">Synced via Cloudflare Worker API • Updated: 2026-09-02 10:05 UTC</text>
    <rect x="520" y="2" width="200" height="20" rx="10" fill="rgba(245,158,11,0.15)" stroke="#F59E0B" stroke-width="0.8" />
    <text x="620" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FBBF24" text-anchor="middle">⚠️ Cached / API Standby</text>
