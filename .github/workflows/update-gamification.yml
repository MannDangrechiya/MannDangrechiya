name: Update Gamification & Live Feeds

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-gamification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Generate XP Bar SVG
        run: python scripts/generate_xp_bar.py

      - name: Generate Heatmap SVG
        run: python scripts/generate_heatmap.py

      - name: Fetch Latest Dev.to Articles
        run: python scripts/fetch_articles.py

      - name: Generate Profile Stats SVG
        run: python scripts/generate_stats_svg.py

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🎮 Update Gamification XP, Heatmap & Live Feeds [skip ci]"
          file_pattern: "assets/svg/*.svg README.md assets/stats.svg"
