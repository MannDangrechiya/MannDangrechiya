name: Consolidated Profile Manager

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  update-profile-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Step 1 - Generate Live Stats SVG Card
        run: python scripts/generate_stats_svg.py

      - name: Step 2 - Update Recent GitHub Activity Feed
        run: python scripts/update_activity_feed.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 3 - Commit & Push Updated Profile Assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): update live stats SVG & GitHub activity feed [skip ci]"
          file_pattern: "assets/stats.svg README.md"
